<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画作展厅 - ForgottenDream</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css\show.css">
</head>
<body>
    <div class="gallery-container">
        <div class="gallery-header">
            <h1>欢迎来到我的艺术馆~</h1>
            <p>这里是我的一些画作作品</p>
        </div>
        
        <div class="gallery-grid" id="artwork-grid"></div>
        
        <div class="gallery-back">
            <a href="index.html">
                <i class="fas fa-home"></i>
                GO HOME
            </a>
        </div>
    </div>
    
    <!-- 模态窗口 -->
    <div class="modal" id="artwork-modal">
        <div class="modal-close" id="modal-close">
            <i class="fas fa-times"></i>
        </div>
        <div class="modal-content">
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modal-img" src="" alt="画作详情">
                </div>
                <div class="modal-details">
                    <h2 class="modal-title" id="modal-title">标题</h2>
                    <div class="modal-meta">
                        <span id="modal-year">年份</span>
                        <span id="modal-size">几×几</span>
                    </div>
                    <div class="modal-description" id="modal-description">
                        简介...
                    </div>
                    <div class="modal-technique">
                        <h4>Style</h4>
                        <p id="modal-technique">绘画类型 / 绘画地点</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js\show.js"></script>
    <script src="js\refresh.js"></script>
</body>
</html>
